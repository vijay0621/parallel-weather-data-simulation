<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Visualization</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <div class="controls" style="justify-content: space-between; width: 100%">
            <div class="left-controls">
                <h1>Visualization</h1>
            </div>
            <div class="right-controls">
                <button id="refreshBtn">Refresh Now</button>
                <select id="numProcs">
                    <option value="4" selected>4 ranks</option>
                    <option value="2">2 ranks</option>
                    <option value="6">6 ranks</option>
                    <option value="8">8 ranks</option>
                </select>
                <span id="lastUpdated">Last updated: —</span>
            </div>
        </div>
    </header>

    <section class="chart-buttons">
        <button data-chart="temp">Temperature</button>
        <button data-chart="humidity">Humidity</button>
        <button data-chart="rain">Weather</button>
        <button data-chart="wind">Wind Speed</button>
    </section>

    <section class="charts">
        <canvas id="chartCanvas"></canvas>
    </section>

    <script src="/script.js"></script>
</body>
</html>
