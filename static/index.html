<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallel Weather - Tamil Nadu</title>
    <link rel="stylesheet" href="/styles.css">
    <script defer src="/script.js"></script>
</head>
<body>
    <header>
        <h1>Parallel Weather Simulation — Tamil Nadu</h1>
        <div class="controls">
            <button id="refreshBtn">Refresh Now</button>
            <select id="numProcs">
                <option value="4" selected>4 ranks</option>
                <option value="2">2 ranks</option>
                <option value="6">6 ranks</option>
                <option value="8">8 ranks</option>
            </select>
            <a class="button-link" href="/visualization.html">Visualization</a>
            <span id="lastUpdated">Last updated: —</span>
        </div>
    </header>

    <section class="averages">
        <div class="avg-item"><strong>Avg Temp</strong>: <span id="avgTemp">—</span> °C</div>
        <div class="avg-item"><strong>Avg Humidity</strong>: <span id="avgHumidity">—</span> %</div>
        <div class="avg-item"><strong>Avg Rainfall</strong>: <span id="avgRain">—</span> mm</div>
        <div class="avg-item"><strong>Avg Wind</strong>: <span id="avgWind">—</span> m/s</div>
    </section>

    <section>
        <h2>District Weather (processed by MPI ranks)</h2>
        <div id="progressContainer" class="progress-container"></div>
        <div id="grid" class="grid"></div>
    </section>

    <section class="metrics">
        <h2>MPI Performance Metrics</h2>
        <div class="metrics-grid">
            <div><strong>Execution Time</strong>: <span id="execTime">—</span> s</div>
            <div><strong>Speedup</strong>: <span id="speedup">—</span>x</div>
            <div><strong>Hottest</strong>: <span id="hottest">—</span></div>
            <div><strong>Coldest</strong>: <span id="coldest">—</span></div>
            <div><strong>Temp Variance</strong>: <span id="variance">—</span></div>
            <div><strong>Alerts</strong>: <span id="alertCount">—</span></div>
        </div>
        <div id="perRankTimes" class="per-rank-times"></div>
        <div id="allgatherAvgs" class="allgather-avgs"></div>
        <div id="processorSummary" class="processor-summary"></div>
    </section>
</body>
</html>
